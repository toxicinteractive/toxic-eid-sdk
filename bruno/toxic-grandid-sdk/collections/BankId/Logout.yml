info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/Logout"
  body:
    type: multipart-form
    data:
      - name: apiKey
        type: text
        value: "{{api-key}}"
      - name: authenticateServiceKey
        type: text
        value: "{{service-key}}"
      - name: sessionId
        type: text
        value: session-id-here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
