info:
  name: FederatedLogin
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/FederatedLogin"
  body:
    type: multipart-form
    data:
      - name: apiKey
        type: text
        value: "{{api-key}}"
      - name: authenticateServiceKey
        type: text
        value: "{{service-key}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
